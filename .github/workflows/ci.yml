name: CI

on: [push]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup default stable
      - run: cargo check --all-features --all

  nostd:
    name: Check no_std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup default stable
      - run: cargo check --no-default-features --features=serde --all

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup default stable
      - run: cargo test --all-features --all
      - run: cargo test --no-default-features --all

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The MSRV is read from `Cargo.toml`'s `rust-version` so it is not
      # duplicated here. `cargo metadata + jq` is preferred over
      # `cargo pkgid | sed` so a future change to cargo's pkgid output
      # format cannot silently break the extraction. `jq` is
      # preinstalled on ubuntu-latest. Stable is installed first because
      # `cargo metadata` needs a working toolchain to run.
      - name: Read MSRV from Cargo.toml
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          msrv="$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "patricia_tree") | .rust_version')"
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: rustup default "$MSRV"
      - run: cargo check --all-features --all-targets

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all -- -D warnings
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
